# DevTinder Services Monitoring Configuration

###############################################################################
# HOST DEFINITIONS
###############################################################################

# Define the DevTinder Frontend
define host {
    use                     linux-server
    host_name               devtinder-frontend
    alias                   DevTinder Frontend Web App
    address                 web-image
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# Define the DevTinder Backend
define host {
    use                     linux-server
    host_name               devtinder-backend
    alias                   DevTinder Backend API
    address                 backend-image
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# Define MongoDB
define host {
    use                     linux-server
    host_name               mongodb
    alias                   MongoDB Database
    address                 mongodb
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# Define Redis
define host {
    use                     linux-server
    host_name               redis
    alias                   Redis Cache
    address                 redis
    max_check_attempts      5
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

###############################################################################
# SERVICE DEFINITIONS
###############################################################################

# Frontend Web Service Check
define service {
    use                     generic-service
    host_name               devtinder-frontend
    service_description     HTTP Service
    check_command           check_http!-p 80 -u /
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notification_period     24x7
}

# Backend API Health Check
define service {
    use                     generic-service
    host_name               devtinder-backend
    service_description     API Health Check
    check_command           check_http!-p 3000 -u /api/health
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notification_period     24x7
}

# Backend API Port Check
define service {
    use                     generic-service
    host_name               devtinder-backend
    service_description     Backend Port 3000
    check_command           check_tcp!3000
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notification_period     24x7
}

# MongoDB Port Check
define service {
    use                     generic-service
    host_name               mongodb
    service_description     MongoDB Port 27017
    check_command           check_tcp!27017
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notification_period     24x7
}

# Redis Port Check
define service {
    use                     generic-service
    host_name               redis
    service_description     Redis Port 6379
    check_command           check_tcp!6379
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    notification_interval   30
    notification_period     24x7
}

###############################################################################
# HOST GROUPS
###############################################################################

define hostgroup {
    hostgroup_name          devtinder-stack
    alias                   DevTinder Application Stack
    members                 devtinder-frontend,devtinder-backend,mongodb,redis
}
